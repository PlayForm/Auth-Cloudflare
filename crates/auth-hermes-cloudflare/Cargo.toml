[package]
name = "auth-hermes-cloudflare"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "auth-hermes-cloudflare: Hermes Agent-specific integration for the Cloudflare Workers AI auth provider - tool schemas, hook dispatch, skill registration"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
auth-cloudflare = { path = "../auth-cloudflare", version = "0.0.1", default-features = false }
serde_json = { workspace = true }