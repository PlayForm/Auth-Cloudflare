[package]
name = "auth-hermes-cloudflare"
version = "0.0.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["cloudflare", "workers-ai", "hermes", "provider"]
categories = ["api-bindings", "authentication"]
description = "auth-hermes-cloudflare: Hermes Agent-specific integration for the Cloudflare Workers AI auth provider - tool schemas, hook dispatch, skill registration"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "auth-hermes-cloudflare"
path = "src/main.rs"

[dependencies]
auth-cloudflare = { path = "../auth-cloudflare", version = "0.0.6", default-features = false }
serde_json = { workspace = true }