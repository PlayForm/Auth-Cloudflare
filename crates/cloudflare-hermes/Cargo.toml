[package]
name = "cloudflare-hermes"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "cloudflare-hermes: Hermes Agent-specific integration for the Cloudflare Workers AI auth provider - tool schemas, hook dispatch, skill registration"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
cloudflare = { path = "../cloudflare", version = "0.0.1", default-features = false }
serde_json = { workspace = true }
