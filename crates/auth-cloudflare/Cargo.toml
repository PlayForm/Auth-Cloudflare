[package]
name = "auth-cloudflare"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["cloudflare", "workers-ai", "authentication", "llm", "catalog"]
categories = ["api-bindings", "authentication", "web-programming"]
description = "auth-cloudflare: Cloudflare Workers AI auth provider core - account/token resolution, model catalog types, cache paths."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "auth-cloudflare"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }