name: Check

concurrency:
  group: Check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Check / Test / Fixtures / Secrets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Strict gate: all previously deferred warnings (catalog.rs field
        # reassign / manual contains, cache.rs doc-list nits, main.rs
        # Iterator::last / large enum variant) are fixed; -D warnings is
        # binding from here on.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Python plugin tests (pytest)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest plugins/auth-hermes-cloudflare/tests/ -q

      - name: Validate fixtures (parse + required keys)
        run: |
          python3 -c '
          import json, glob, os, sys
          ok = True
          files = sorted(glob.glob("plugins/auth-hermes-cloudflare/fixtures/*.json"))
          if not files:
              print("FAIL: no fixture files found")
              sys.exit(1)
          for f in files:
              base = os.path.basename(f)
              d = json.load(open(f))
              if base.startswith("auth_cloudflare_version"):
                  req = ("name", "package_version", "protocol_version")
              elif base.startswith("catalog_"):
                  req = ("success", "errors")
              elif base.startswith("workers_ai_catalog"):
                  req = ("data",)
              else:
                  print("FAIL", base, "unexpected fixture name")
                  ok = False
                  continue
              missing = [k for k in req if k not in d]
              if missing:
                  print("FAIL", base, "missing keys", missing)
                  ok = False
              if base.startswith("catalog_") and "errors" in d and not (
                  isinstance(d["errors"], list) and len(d["errors"]) > 0
                  and all(isinstance(e, dict) and "code" in e and "message" in e for e in d["errors"])
              ):
                  print("FAIL", base, "errors must be a non-empty list of {code,message}")
                  ok = False
              if base.startswith("workers_ai_catalog") and "data" in d and not (
                  isinstance(d["data"], list) and len(d["data"]) > 0
                  and all(isinstance(m, dict) and "id" in m for m in d["data"])
              ):
                  print("FAIL", base, "data must be a non-empty list of {id,...}")
                  ok = False
              print("OK", base)
          sys.exit(0 if ok else 1)
          '

      - name: Regenerate catalog docs from fixtures (offline, no network)
        # Seeds a scratch account cache from crates/auth-cloudflare/fixtures/
        # and regenerates docs/catalog.generated.* through the binary's export
        # commands. Deterministic: AUTH_CLOUDFLARE_CACHE_DIR pins the cache
        # path (Config::cache_dir override), synthetic creds never touch the
        # network, and the output must be non-empty + mark the source.
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          trap 'rm -rf "$SCRATCH"' EXIT
          CACHE_DIR="$SCRATCH/cache"
          mkdir -p "$CACHE_DIR"
          python3 - "$CACHE_DIR" <<'PY'
          import json, os, sys, glob, datetime
          cache_dir = sys.argv[1]
          fixtures = sorted(glob.glob("crates/auth-cloudflare/fixtures/models/*.json"))
          assert fixtures, "no Rust model fixtures found"
          data = [json.load(open(f)) for f in fixtures]
          with open(os.path.join(cache_dir, "catalog.json"), "w") as fh:
              json.dump({"data": data}, fh)
          meta = {
              "schema_version": 1,
              "fetched_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "source": "cloudflare-workers-ai",
              "model_count": len(data),
              "account_fingerprint": "fixture",
          }
          with open(os.path.join(cache_dir, "catalog.meta.json"), "w") as fh:
              json.dump(meta, fh)
          PY
          OUT="$SCRATCH/out"
          mkdir -p "$OUT"
          AUTH_CLOUDFLARE_EXPORT_DIR="$OUT" \
          AUTH_CLOUDFLARE_CACHE_DIR="$CACHE_DIR" \
          AUTH_CLOUDFLARE_ACCOUNT_ID="0123456789abcdef0123456789abcdef" \
          AUTH_CLOUDFLARE_API_TOKEN="cfut_test_ci_fixture_regeneration" \
            target/debug/auth-cloudflare catalog export yaml
          AUTH_CLOUDFLARE_EXPORT_DIR="$OUT" \
          AUTH_CLOUDFLARE_CACHE_DIR="$CACHE_DIR" \
          AUTH_CLOUDFLARE_ACCOUNT_ID="0123456789abcdef0123456789abcdef" \
          AUTH_CLOUDFLARE_API_TOKEN="cfut_test_ci_fixture_regeneration" \
            target/debug/auth-cloudflare catalog export markdown
          test -s "$OUT/catalog.generated.yaml"
          test -s "$OUT/catalog.generated.md"
          grep -q "GENERATED FILE" "$OUT/catalog.generated.yaml"
          grep -q "Cloudflare Workers AI catalog" "$OUT/catalog.generated.md"
          grep -q "deepseek-v4-flash-0731" "$OUT/catalog.generated.yaml"
          echo "Fixture docs regeneration OK (3 fixture models, offline)."

      - name: Secret scan (literal tokens only)
        # Fails only on LITERAL secret values. Synthetic redaction-test values
        # (cfut_SECRET, cfut_leaked, cfut_test_*) and doc examples using shell
        # variables ($CLOUDFLARE_API_TOKEN) or <placeholders> are allowed; real
        # Cloudflare tokens are cfut_/cfwt_ + 40+ chars and always trip the
        # {20,} length gate (mirrors .githooks/pre-commit). Compiled __pycache__
        # artifacts are excluded. Scanned: crates/ plugins/ skills/ .github/.
        run: |
          set -euo pipefail
          HITS=$(grep -rEn \
            '(cfut_|cfwt_)[0-9A-Za-z]{20,}|Authorization: Bearer [A-Za-z0-9]{20,}|HERMES_CUSTOM_API_CLOUDFLARE_COM_API_KEY=[0-9A-Za-z]' \
            crates/ plugins/ skills/ .github/ \
            --exclude-dir='__pycache__' --exclude='*.pyc' 2>/dev/null \
            | grep -vE '(cfut_|cfwt_)test_' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Literal secret pattern found:"
            echo "$HITS"
            exit 1
          fi
          echo "Secret scan clean: no literal cfut_/cfwt_/Bearer/API-key values."