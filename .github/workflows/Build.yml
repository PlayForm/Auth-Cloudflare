name: Build

concurrency:
  group: Build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  pull-requests: write

on:
  push:
    tags: ["Cloudflare/v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release -p auth-cloudflare -p auth-hermes-cloudflare --target ${{ matrix.target }}

      - name: Package tarballs + SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' crates/auth-cloudflare/Cargo.toml | head -1 | awk -F'"' '{print $2}')
          T="${{ matrix.target }}"
          STAGE=$(mktemp -d)
          cp "target/$T/release/auth-cloudflare" "$STAGE/auth-cloudflare"
          cp "target/$T/release/auth-hermes-cloudflare" "$STAGE/auth-hermes-cloudflare"
          tar -czf "auth-cloudflare-$T.tar.gz" -C "$STAGE" auth-cloudflare
          tar -czf "auth-hermes-cloudflare-$T.tar.gz" -C "$STAGE" auth-hermes-cloudflare
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum auth-cloudflare-$T.tar.gz auth-hermes-cloudflare-$T.tar.gz > SHA256SUMS
          else
            shasum -a 256 auth-cloudflare-$T.tar.gz auth-hermes-cloudflare-$T.tar.gz > SHA256SUMS
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packed auth-cloudflare-$T.tar.gz + auth-hermes-cloudflare-$T.tar.gz (v$VERSION)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            auth-cloudflare-${{ matrix.target }}.tar.gz
            auth-hermes-cloudflare-${{ matrix.target }}.tar.gz
            SHA256SUMS

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/Cloudflare/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true