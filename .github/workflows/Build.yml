name: Build

concurrency:
  group: Build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  pull-requests: write

on:
  push:
    tags: ["Cloudflare/v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1

jobs:
  Release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/Cloudflare/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Creates the release exactly once, before any matrix job attaches
      # files, so the four concurrent `action-gh-release` invocations don't
      # race to create it. No files are attached here - each Build leg
      # attaches only its own artifacts, and Finalize verifies the result.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Build:
    name: Build ${{ matrix.target }}
    needs: Release
    if: always() && (needs.Release.result == 'success' || needs.Release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish (and attach its assets) even if one leg is
      # slow or fails. The `Finalize` job below then fails loudly if the
      # matrix came out incomplete, so a partial upload is caught rather than
      # silently shipped.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14 # x86_64 cross-compiled from the arm64 runner
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Install cross linker (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release -p auth-cloudflare -p auth-hermes-cloudflare --target ${{ matrix.target }}

      # Each matrix leg packages ONLY its own two tarballs and writes ONLY its
      # own per-target checksum file. A shared root-level combined checksum
      # file is never written: all four legs would collide on that filename,
      # and download-artifact's merge-multiple would keep only one target's sums.
      - name: Package tarballs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' crates/auth-cloudflare/Cargo.toml | head -1 | awk -F'"' '{print $2}')
          T="${{ matrix.target }}"
          STAGE=$(mktemp -d)
          cp "target/$T/release/auth-cloudflare" "$STAGE/auth-cloudflare"
          cp "target/$T/release/auth-hermes-cloudflare" "$STAGE/auth-hermes-cloudflare"
          tar -czf "auth-cloudflare-$T.tar.gz" -C "$STAGE" auth-cloudflare
          tar -czf "auth-hermes-cloudflare-$T.tar.gz" -C "$STAGE" auth-hermes-cloudflare
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packed auth-cloudflare-$T.tar.gz + auth-hermes-cloudflare-$T.tar.gz (v$VERSION)"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "auth-cloudflare-$T.tar.gz" "auth-hermes-cloudflare-$T.tar.gz" > "SHA256SUMS-$T.txt"
          else
            shasum -a 256 "auth-cloudflare-$T.tar.gz" "auth-hermes-cloudflare-$T.tar.gz" > "SHA256SUMS-$T.txt"
          fi
          cat "SHA256SUMS-$T.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            auth-cloudflare-${{ matrix.target }}.tar.gz
            auth-hermes-cloudflare-${{ matrix.target }}.tar.gz
            SHA256SUMS-${{ matrix.target }}.txt
          retention-days: 30

      # The Release job above already created the release (exactly once);
      # each matrix job only attaches its own files here. fail_on_unmatched_files
      # turns a slipped rename into a loud failure instead of a silent partial release.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/Cloudflare/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            auth-cloudflare-${{ matrix.target }}.tar.gz
            auth-hermes-cloudflare-${{ matrix.target }}.tar.gz
            SHA256SUMS-${{ matrix.target }}.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs once, only after EVERY matrix leg has finished attaching (needs: Build).
  # Asserts all four targets' assets are present and fails loudly otherwise, so
  # release notes can never truthfully be authored for an incomplete matrix.
  Finalize:
    name: Finalize release assets
    needs: [Build]
    if: startsWith(github.ref, 'refs/tags/Cloudflare/v')
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
    steps:
      # The Finalize job writes into the child submodule, so it needs the
      # full tree checked out (submodules included) - the release-asset
      # verification above only touches the network.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify every target's assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "Attached assets:"; echo "$assets"
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "$assets" | grep -Fxq "auth-cloudflare-$t.tar.gz"        || { echo "::error::missing auth-cloudflare-$t.tar.gz";        missing=1; }
            echo "$assets" | grep -Fxq "auth-hermes-cloudflare-$t.tar.gz" || { echo "::error::missing auth-hermes-cloudflare-$t.tar.gz"; missing=1; }
            echo "$assets" | grep -Fxq "SHA256SUMS-$t.txt"                || { echo "::error::missing SHA256SUMS-$t.txt";                missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release matrix is incomplete - do NOT publish notes claiming a full platform set."
            exit 1
          fi
          echo "All 4 targets present (8 tarballs + 4 per-target checksums). Matrix complete."

      # The in-tree checksum list is the trust anchor for the pinned plugin
      # tree: download.sh in plugins/auth-hermes-cloudflare validates the
      # release download against it, so it must come from THIS build, not be
      # hand-maintained. Consolidate the four per-target sums assets into
      # plugins/auth-hermes-cloudflare/SHA256SUMS.txt and commit it INSIDE the
      # child submodule (the pinned plugin repo). Publish.yml then advances
      # the parent's gitlink to this new child commit.
      - name: Generate in-tree SHA256SUMS.txt (child submodule)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYFORM_RELEASE_PAT: ${{ secrets.PLAYFORM_RELEASE_PAT }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#Cloudflare/v}"
          CHILD="plugins/auth-hermes-cloudflare"
          echo "BINARY_VERSION: ${V}" > "${CHILD}/SHA256SUMS.txt"
          echo "" >> "${CHILD}/SHA256SUMS.txt"
          echo "# GENERATED BY Build.yml - do not edit by hand." >> "${CHILD}/SHA256SUMS.txt"
          echo "" >> "${CHILD}/SHA256SUMS.txt"
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "${t}:" >> "${CHILD}/SHA256SUMS.txt"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "SHA256SUMS-${t}.txt" --dir /tmp/sums-$$ --clobber 2>/dev/null
            sed 's/^/  /' "/tmp/sums-$$/SHA256SUMS-${t}.txt" >> "${CHILD}/SHA256SUMS.txt"
            echo "" >> "${CHILD}/SHA256SUMS.txt"
          done
          cat "${CHILD}/SHA256SUMS.txt"
          # Commit inside the child submodule, on its Current branch (the
          # line the catalog pins), then push so Publish.yml can bump the
          # parent gitlink to it.
          git -C "${CHILD}" config user.name  "github-actions[bot]"
          git -C "${CHILD}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${CHILD}" checkout Current
          git -C "${CHILD}" add SHA256SUMS.txt
          if git -C "${CHILD}" diff --cached --quiet; then
            echo "SHA256SUMS.txt unchanged - nothing to commit"
          else
            git -C "${CHILD}" commit -m "chore: update in-tree SHA256SUMS.txt for v${V} (Build.yml)"
            # GITHUB_TOKEN is scoped to the parent repo and cannot push to the
            # child (PlayForm/Auth-Hermes-Cloudflare); the Release-environment
            # secret carries a fine-grained PAT with contents:write on the
            # child only. Fail loudly when it is missing rather than pushing
            # an unauth'd URL.
            if [ -z "${PLAYFORM_RELEASE_PAT:-}" ]; then
              echo "::error::PLAYFORM_RELEASE_PAT (Release-environment secret) is not set - cannot push the in-tree SHA256SUMS.txt to the child repo" >&2
              exit 1
            fi
            git -C "${CHILD}" push "https://x-access-token:${PLAYFORM_RELEASE_PAT}@github.com/PlayForm/Auth-Hermes-Cloudflare.git" Current
          fi
