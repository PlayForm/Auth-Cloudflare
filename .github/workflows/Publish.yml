name: Publish

concurrency:
  group: Publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write # crates.io trusted publishing (OIDC)

on:
  push:
    tags: ["Cloudflare/v*"]
  workflow_dispatch:
    inputs:
      publish_crates:
        description: "Attempt `cargo publish` to crates.io (publishes auth-cloudflare first, then auth-hermes-cloudflare)"
        type: boolean
        default: false

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # Scope to the crates we actually publish (auth-cloudflare,
      # auth-hermes-cloudflare).
      - name: Cargo test
        run: cargo test -p auth-cloudflare -p auth-hermes-cloudflare --release

  Publish-auth-cloudflare:
    name: Publish auth-cloudflare
    needs: [Test]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p auth-cloudflare

      # crates.io publishing is strictly opt-in: a plain `Cloudflare/v*` tag
      # push does NOT publish to crates.io (that tag only triggers Build.yml's
      # GitHub Release). Publish happens only on an explicit `workflow_dispatch`
      # with publish_crates=true, so a tag-push release can never burn an
      # immutable crates.io version. crates.io versions are immutable, so check
      # the sparse index first and skip if this version is already live.
      - name: Check if auth-cloudflare version is already published
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates }}
        id: check
        run: |
          VERSION=$(grep '^version' crates/auth-cloudflare/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sL "https://index.crates.io/au/th/auth-cloudflare" | grep -q "\"vers\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get crates.io publish token (trusted publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish auth-cloudflare to crates.io (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates && steps.check.outputs.published == 'false' }}
        run: cargo publish -p auth-cloudflare --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  Publish-auth-hermes-cloudflare:
    name: Publish auth-hermes-cloudflare
    needs: [Publish-auth-cloudflare]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p auth-hermes-cloudflare

      # auth-hermes-cloudflare path-depends on auth-cloudflare (version 0.0.4),
      # and `cargo publish` strips the path key, so it can only publish once a
      # matching auth-cloudflare 0.0.4 is live on crates.io (published by the
      # preceding Publish-auth-cloudflare job). Opt-in semantics and the
      # index-version skip are the same as above.
      - name: Check if auth-hermes-cloudflare version is already published
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates }}
        id: check
        run: |
          VERSION=$(grep '^version' crates/auth-hermes-cloudflare/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sL "https://index.crates.io/au/th/auth-hermes-cloudflare" | grep -q "\"vers\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get crates.io publish token (trusted publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish auth-hermes-cloudflare to crates.io (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates && steps.check.outputs.published == 'false' }}
        run: cargo publish -p auth-hermes-cloudflare --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The catalog pins the CHILD plugin repo (plugins/auth-hermes-cloudflare
  # submodule); Build.yml's Finalize job commits the fresh in-tree
  # SHA256SUMS.txt inside the child and pushes its Current. This job advances
  # the PARENT's gitlink to that child commit so the pinned tree carries the
  # checksums that download.sh validates against.
  Bump-Plugin-Gitlink:
    name: Bump plugin submodule gitlink
    needs: [Publish-auth-hermes-cloudflare]
    if: startsWith(github.ref, 'refs/tags/Cloudflare/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Advance child submodule to its Current tip
        run: |
          set -euo pipefail
          CHILD="plugins/auth-hermes-cloudflare"
          V="${GITHUB_REF_NAME#Cloudflare/v}"
          # Build.yml's Finalize pushes the child commit carrying the fresh
          # in-tree SHA256SUMS.txt AFTER the release matrix - which outruns
          # this job every time. Do not race it: wait (bounded) until the
          # child tip's in-tree file pins THIS version, then bump to it.
          attempts=0
          while [ "$attempts" -lt 40 ]; do
            if git -C "${CHILD}" fetch origin Current 2>/dev/null && \
               git -C "${CHILD}" show "origin/Current:SHA256SUMS.txt" 2>/dev/null | grep -q "^BINARY_VERSION: ${V}$"; then
              break
            fi
            attempts=$((attempts + 1))
            echo "child checksum commit for v${V} not yet visible (attempt ${attempts}/40); retrying in 15s"
            sleep 15
          done
          if ! git -C "${CHILD}" show "origin/Current:SHA256SUMS.txt" 2>/dev/null | grep -q "^BINARY_VERSION: ${V}$"; then
            echo "::error::child in-tree SHA256SUMS.txt for v${V} never appeared - gitlink left as-is" >&2
            exit 1
          fi
          git -C "${CHILD}" checkout -q origin/Current
          echo "child now at: $(git -C "${CHILD}" rev-parse HEAD)"

      - name: Commit the gitlink bump
        run: |
          set -euo pipefail
          CHILD="plugins/auth-hermes-cloudflare"
          if git diff --quiet -- "${CHILD}"; then
            echo "gitlink already at child Current tip - nothing to bump"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          V="${GITHUB_REF_NAME#Cloudflare/v}"
          git add "${CHILD}"
          git commit -m "chore: bump plugins/auth-hermes-cloudflare to child Current (in-tree SHA256SUMS.txt for v${V})"
          # The tag was pushed from Current; keep the parent's branch in sync.
          BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || echo Current)"
          git push origin "HEAD:${BRANCH}"
